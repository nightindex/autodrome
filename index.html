<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16382e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/avtodrom-icon.svg" />
    <meta name="description" content="Chevrolet Cobalt 2026, 5 pog‘onali mexanika: B toifali avtodrom mashqlari va amaliy imtihon simulyatori." />
    <title>AVTODROM — Chevrolet Cobalt 2026 · 5MT</title>
    <style>
      #boot-loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;box-sizing:border-box;padding:24px;overflow:auto;background:#f7f6ec;color:#214c3d;font-family:'Segoe UI',Arial,sans-serif}
      #boot-loader[hidden]{display:none}
      .boot-content{width:100%;max-width:360px}
      .boot-brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;letter-spacing:2px}
      .boot-logo{display:block;width:min(260px,100%);height:44px;object-fit:contain}
      #boot-title{font-size:26px;line-height:1.25;font-weight:500;letter-spacing:-.5px;margin:36px 0 12px}
      .boot-status{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px;font-size:13px;line-height:1.5;color:#536950}
      #boot-percent{font-variant-numeric:tabular-nums;white-space:nowrap}
      #boot-progress{display:block;appearance:none;border:0;border-radius:0;width:100%;height:4px;overflow:hidden;background:#d6ddce;accent-color:#214c3d}
      #boot-progress::-webkit-progress-bar{background:#d6ddce}#boot-progress::-webkit-progress-value{background:#214c3d}#boot-progress::-moz-progress-bar{background:#214c3d}
      #boot-progress:indeterminate{background:linear-gradient(90deg,#d6ddce 35%,#748f78 50%,#d6ddce 65%);background-size:200% 100%;animation:boot-loading 1.6s linear infinite}
      #boot-progress:indeterminate::-webkit-progress-bar{background:transparent}
      #boot-error{font-size:14px;line-height:1.6;color:#91452e}
      #boot-retry{min-height:44px;margin-top:12px;padding:12px 18px;border:0;border-radius:5px;background:#214c3d;color:#fffdf2;font:600 13px 'Segoe UI',Arial,sans-serif;cursor:pointer}
      #boot-retry:focus-visible{outline:3px solid #c59945;outline-offset:4px}
      #boot-loader [hidden]{display:none!important}
      @keyframes boot-loading{to{background-position:-200% 0}}
      @media(prefers-reduced-motion:reduce){#boot-progress:indeterminate{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot-loader" role="region" aria-labelledby="boot-title">
      <div class="boot-content">
        <div class="boot-brand"><img class="boot-logo" src="/assets/branding/avtodrom-logo.svg" alt="AVTODROM" width="260" height="44" fetchpriority="high"></div>
        <h1 id="boot-title">Simulyator tayyorlanmoqda</h1>
        <div class="boot-status"><span id="boot-stage" role="status">Yuklanmoqda…</span><span id="boot-percent" aria-hidden="true"></span></div>
        <progress id="boot-progress" max="1" aria-labelledby="boot-stage"></progress>
        <p id="boot-error" role="alert" hidden></p>
        <button id="boot-retry" hidden>Qayta yuklash</button>
      </div>
    </div>
    <div id="app" aria-busy="true" inert></div><script type="module" src="/src/main.ts"></script>
  </body>
</html>
